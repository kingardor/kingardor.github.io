# Build → prerender → deploy to Cloudflare Workers (static assets + Veronica API).
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — wrangler auth
# Runtime secrets (OPENROUTER_API_KEY) live on the Worker itself, set once via
# `npx wrangler secret put`; they are not part of the deploy.

name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      # Install a modern Chrome for the prerender step
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: setup-chrome

      # Pre-render the homepage to static HTML for SEO
      - run: npm run prerender
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
