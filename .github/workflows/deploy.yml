# Build → prerender → deploy to Cloudflare Workers (static assets + Veronica API).
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — wrangler auth
# Runtime secrets (OPENROUTER_API_KEY) live on the Worker itself, set once via
# `npx wrangler secret put`; they are not part of the deploy.

name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      # Install a modern Chrome for the prerender step
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      # Pre-render the homepage to static HTML for SEO
      - run: npm run prerender
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
